id = "aws-cloudformation"
name = "AWS Cloudformation"
version = "0.1.0"
schema_version = 1
authors = ["Keaton Burleson <keaton.burleson@me.com>"]
description = "AWS Cloudformation LSP for Zed"
repository = "https://github.com/128keaton/aws-cloudformation-lsp-zed"
first_line_pattern = "^[{]\n*\s*"AWS.*|AWSTemplateFormatVersion:\s*["|']\d{4}-\d{2}-\d{2}["|']

[grammars.yaml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-yaml"
rev = "4463985dfccc640f3d6991e3396a2047610cf5f8"

[grammars.json]
repository = "https://github.com/tree-sitter/tree-sitter-json"
rev = "001c28d7a29832b06b0e831ec77845553c89b56d"

[language_servers.aws-cloudformation]
name = "AWS Cloudformation Language Server"
languages = ["YAML", "JSON"]
